:root {
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-display: "PT Serif", Georgia, "Times New Roman", serif;
  --slug: 10mm;   /* поле под метки реза вокруг обрезного формата */
  --bleed: 3mm; /* вылеты фона за линию реза */
  --surface: #ffffff; --text: #1d1c1a; --muted: #6c6860; --line: #e8e4dc; --chip: #eeebe5; --accent: #2f6b4f; 
}

* { box-sizing: border-box; }

html {
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

body {
  margin: 0;
  background: #d8d5cf;
  color: var(--text);
  font-family: var(--font);
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 16px;
  color: #3a3631;
  font-size: 14px;
}

.toolbar button {
  padding: 10px 18px;
  border: 0;
  border-radius: 999px;
  background: #1d1c1a;
  color: #fff;
  font: 700 14px/1 var(--font);
  cursor: pointer;
}

/* Лист печати: обрезной формат + вылеты + поле с метками */
.plate {
  position: relative;
  width: calc(105mm + 2 * var(--slug));
  height: calc(148mm + 2 * var(--slug));
  margin: 0 auto 10mm;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 4px 30px rgba(0, 0, 0, .18);
  break-after: page;
  page-break-after: always;
}

.plate:last-child {
  break-after: auto;
  page-break-after: auto;
}

.bleed {
  position: absolute;
  inset: calc(var(--slug) - var(--bleed));
  background: var(--surface);
}

.marks {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.sheet {
  position: absolute;
  top: var(--slug);
  left: var(--slug);
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 105mm;
  height: 148mm;
  padding: 8mm 8mm 7mm;
  text-align: center;
}

/* Тонкая декоративная рамка внутри листа */
.sheet::before {
  content: "";
  position: absolute;
  inset: 4mm;
  border: .3mm solid var(--line);
  border-radius: 3mm;
  pointer-events: none;
}

.brand {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3mm;
  max-width: 100%;
}

.brand img {
  width: 12mm;
  height: 12mm;
  border-radius: 50%;
  object-fit: cover;
  flex: none;
}

.brand__name {
  font: 700 13pt/1.15 var(--font-display);
  text-align: left;
}

.cta { margin-top: 5mm; }

.cta__title {
  color: var(--accent);
  font: 700 28pt/1 var(--font-display);
  letter-spacing: -.01em;
}

.cta__sub {
  margin-top: 2mm;
  color: var(--text);
  font-size: 9pt;
  line-height: 1.3;
}

.cta__en {
  margin-top: .8mm;
  color: var(--muted);
  font-size: 7.5pt;
}

.qr {
  width: 56mm;
  height: 56mm;
  margin-top: 4mm;
  padding: 3.5mm;
  border: .6mm solid var(--accent);
  border-radius: 4mm;
  background: #fff;
}

.qr svg {
  display: block;
  width: 100%;
  height: 100%;
}

.url {
  margin-top: 2mm;
  color: var(--muted);
  font-size: 7.5pt;
  letter-spacing: .02em;
}

.wifi {
  display: flex;
  align-items: center;
  gap: 3.5mm;
  width: 100%;
  margin-top: auto;
  padding: 3mm 3.5mm;
  border-radius: 3mm;
  background: var(--chip);
  text-align: left;
}

.wifi__qr {
  flex: none;
  width: 20mm;
  height: 20mm;
  padding: 1mm;
  border-radius: 1.5mm;
  background: #fff;
}

.wifi__qr svg { display: block; width: 100%; height: 100%; }

.wifi__title { font-size: 9pt; font-weight: 700; }
.wifi__row { margin-top: .6mm; font-size: 8.5pt; word-break: break-all; }
.wifi__row span { color: var(--muted); }
.wifi__hint { margin-top: .8mm; color: var(--muted); font-size: 6.5pt; }

@media print {
  body { background: none; }
  .toolbar { display: none; }
  .plate { margin: 0; box-shadow: none; }
}
</style>
